<!DOCTYPE html>
<html>
    <head>
        <title>HTML Forms</title>
    </head>
    <body>
        <h1 style="color: pink;">LM Designs Forms</h1>
        <form>
            <label for="usename">enter username</label>
            <input type="text" id="username">
            <br><br>
            <label for="email">enter email</label>
            <input type="email" id="email">
            <br><br>
            <label for="password">passoword:</label>
            <input type="password" id="password">

            <p>Select your age:</p>
            <input type="radio" name="age" value="0-25" id="option-1">
            <label for="option-1">0-25</label>
            <input type="radio" name="age" value="0-25" id="option-2">
            <label for="option-2">26-50</label>
            <input type="radio" name="age" value="0-25" id="option-3">
            <label for="option-3">50+</label>

            <br><br>
            <label for="question">Security questions:</label>
            <select names="question" id="question">
                <option value="q1">what is your favourite color</option>
                <option value="q2">what is your favourite food</option>
                <option value="q3">what is your favourite pet</option>
            </select>

            <br><br>

<label for="answer">Security questions answer:</label>
            <input type="text" id="answer" name="answer">


        </form>
    </body>
</html>
